[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "live2dagent"
version = "2.0.0a1"
description = "live2dagent - Your personal AI desktop companion with Live2D"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "live2dagent Team"},
]
keywords = ["ai", "desktop-pet", "live2d", "companion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "websockets>=12.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "structlog>=24.0",
    "toml>=0.10.2",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
    "qasync>=0.27",
    "live2d-py>=0.5.3",
    "markdown-it-py>=3.0",
    "pygments>=2.17",
]
ai = [
    "google-genai>=1.0",
    "openai>=1.30",
    "anthropic>=0.28",
]
audio = [
    "edge-tts>=6.1",
    "sounddevice>=0.4",
    "soundfile>=0.12",
]
asr = [
    "faster-whisper>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
gui-dev = [
    "pytest-qt>=4.2",
]
all = [
    "live2dagent[gui,ai,audio,asr,dev]",
]

[project.scripts]
live2dagent-gateway = "aipet.gateway.server:main"
live2dagent-frontend = "aipet.frontend.app:main"
live2dagent = "aipet.launcher:main"

[project.urls]
Homepage = "https://github.com/whommm/live2dagent"
Documentation = "https://github.com/whommm/live2dagent/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "N802", # Qt override methods (mousePressEvent, paintGL, etc.)
    "N806", # Win32 API constants (GWL_EXSTYLE, WS_EX_TRANSPARENT, etc.)
]

[tool.ruff.lint.per-file-ignores]
"src/aipet/frontend/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "sounddevice",
    "soundfile",
    "qasync",
    "toml",
    "google.generativeai",
    "edge_tts",
]
ignore_missing_imports = true


